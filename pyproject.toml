[project]
name = "posture-guard"
version = "0.1.0"
description = "Camera-based posture monitor that disables Mac Wi-Fi after sustained posture deviation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mediapipe>=0.10.14,<0.10.30",
    "numpy>=1.26",
    "opencv-python>=4.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
posture-guard = "posture_guard.cli:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"
